{% extends "base.html" %}
{% block title %}Dashboard — CareerIQ{% endblock %}
{% block page_title %}Dashboard{% endblock %}
{% block content %}
<div class="stats-row">
  <div class="stat-card"><div class="stat-icon si-blue"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Skills tracked</div></div></div>
  <div class="stat-card"><div class="stat-icon si-green"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Jobs matched</div></div></div>
  <div class="stat-card"><div class="stat-icon si-amber"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">Role readiness</div></div></div>
  <div class="stat-card"><div class="stat-icon si-purple"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Applications</div></div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <div class="card">
    <div class="card-header"><h2 class="card-title">Top job matches</h2><a href="/recommendations" class="link-sm">See all →</a></div>
    <div id="recList"><div class="empty-state">Loading…</div></div>
  </div>
  <div class="card">
    <div class="card-header"><h2 class="card-title">Skills in demand</h2><a href="/skill-gap" class="link-sm">Analyze →</a></div>
    <div id="skillList"><div class="empty-state">Loading…</div></div>
  </div>
</div>
<script>
(async()=>{
  requireAuth(); loadUserChip();
  document.querySelector("[data-page='dashboard']")?.classList.add("active");
  const [sk,rc,sg,ap]=await Promise.allSettled([
    API.get("/profile/skills"),
    API.get("/recommendations/jobs?top_n=5"),
    API.get("/skill-gap/reports"),
    API.get("/applications/"),
  ]);
  document.getElementById("s1").textContent=sk.status==="fulfilled"?sk.value.skills.length:0;
  document.getElementById("s2").textContent=rc.status==="fulfilled"?rc.value.recommendations.length:0;
  document.getElementById("s4").textContent=ap.status==="fulfilled"?ap.value.applications.length:0;
  if(sg.status==="fulfilled"&&sg.value.reports.length){
    const r=sg.value.reports[0];
    document.getElementById("s3").textContent=Math.round((1-r.overall_gap_score)*100)+"%";
  }else{document.getElementById("s3").textContent="N/A";}
  const rl=document.getElementById("recList");
  if(rc.status==="fulfilled"&&rc.value.recommendations.length){
    rl.innerHTML=rc.value.recommendations.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg3);border-radius:8px;margin-bottom:8px">
      <div><div style="font-weight:500">${i.job.title}</div><div style="font-size:.78rem;color:var(--text2)">${i.job.company||""}·${i.job.location||""}</div></div>
      <span style="background:rgba(108,138,255,.15);color:var(--accent);padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:600">${Math.round(i.score*100)}%</span>
    </div>`).join("");
  }else{rl.innerHTML='<div class="empty-state">Add skills to see matches.</div>';}
  const ssl=document.getElementById("skillList");
  try{
    const sr=await API.get("/recommendations/skills?top_n=6");
    if(sr.skills_to_learn.length){
      ssl.innerHTML=sr.skills_to_learn.map(s=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px"><span>${s.name}</span><span style="color:var(--text3)">${s.count} jobs</span></div><div style="height:4px;background:var(--border);border-radius:2px"><div style="height:100%;background:var(--accent);border-radius:2px;width:${Math.min(100,(s.count/sr.skills_to_learn[0].count)*100)}%"></div></div></div>`).join("");
    }else{ssl.innerHTML='<div class="empty-state">No suggestions yet.</div>';}
  }catch{ssl.innerHTML='<div class="empty-state">No suggestions yet.</div>';}
})();
</script>
{% endblock %}
